name = "millmoor-takes-over-local"
main = "server/worker.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*", "/auth/*"]
[env.test]
name = "millmoor-takes-over-test"
workers_dev = true
[env.test.vars]
ENVIRONMENT = "test"
ALLOW_TEST_ACCOUNTS = "true"
[env.test.assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*", "/auth/*"]
# Production has no deployment command. Create an approved environment only after review.
